[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-qa-chunking"
version = "0.1.0"
description = "Minimal experiments for meeting-transcript chunking and retrieval."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
experiment = ["rouge-score>=0.1.2,<0.2", "sentence-transformers>=3,<6"]

[project.scripts]
meeting-qa = "meeting_qa_chunking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
